# nginx front for the OpenTalking Modal container.
#
# Modal exposes exactly one HTTP port (8080). nginx serves the built WebUI and
# proxies /api/* (prefix stripped) and /streaming/* to the single-process
# OpenTalking server on 127.0.0.1:8000, mirroring docker/nginx-web.conf and the
# Vite preview proxy in apps/web/vite.config.ts.

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 8080 default_server;

  root /app/apps/web/dist;
  index index.html;

  # Avatar / video / knowledge-document uploads.
  client_max_body_size 1024m;

  # Optional HTTP basic auth. modal_entrypoint.py writes this file; it is empty
  # when OT_BASIC_AUTH_USER / OT_BASIC_AUTH_PASSWORD are not set.
  include /etc/nginx/opentalking-auth.conf;

  location /api/ {
    proxy_pass http://127.0.0.1:8000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # SSE (/sessions/{id}/events) must not be buffered.
    proxy_buffering off;
    proxy_cache off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location /streaming/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
